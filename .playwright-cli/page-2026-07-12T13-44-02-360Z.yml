    - region "Downconversion makes the carrier stand still" [ref=e75]:
      - generic [ref=e76]:
        - generic [ref=e77]: Mental model 02
        - heading "Downconversion makes the carrier stand still" [level=2] [ref=e78]
        - paragraph [ref=e79]: "Why this step matters: storage and signal processing should scale with the information bandwidth, not with the radio station’s address on the frequency dial."
      - img "RF signal is mixed with cosine and sine references, then low-pass filtered into I and Q" [ref=e80]:
        - generic [ref=e81]:
          - strong [ref=e82]: Incoming RF
          - text: A fast rotating signal near the tuned carrier.
        - generic [ref=e83]: →
        - generic [ref=e84]:
          - strong [ref=e85]: Two mixers
          - text: Compare with cosine for I and sine for Q.
        - generic [ref=e86]: →
        - generic [ref=e87]:
          - strong [ref=e88]: Complex baseband
          - text: The carrier stops; only slow changes remain.
      - generic [ref=e89]:
        - paragraph [ref=e90]: If the receiver’s reference rotates at the same speed as the carrier, the carrier looks stationary—like jogging beside another runner. Modulation appears as the remaining slow motion of the I/Q arrow.
        - generic [ref=e91]:
          - strong [ref=e92]: "Common confusion:"
          - text: Q is not “quality,” and it is not a second antenna. It is the result of measuring the same signal against a reference shifted by one quarter-cycle.
    - region "I/Q preserves rotation direction" [ref=e93]:
      - generic [ref=e94]:
        - generic [ref=e95]: The capability one real channel loses at baseband
        - heading "I/Q preserves rotation direction" [level=2] [ref=e96]
        - paragraph [ref=e97]:
          - text: A real cosine cannot distinguish
          - code [ref=e98]: +f
          - text: from
          - code [ref=e99]: −f
          - text: ":"
          - code [ref=e100]: cos(+ωt) = cos(−ωt)
          - text: . But after tuning, those signs mean “above the center frequency” and “below the center frequency.” I/Q keeps them separate.
      - generic [ref=e101]:
