      - generic [ref=e160]:
        - article [ref=e161]:
          - heading "Amplitude changes" [level=3] [ref=e162]
          - paragraph [ref=e163]: The point moves toward or away from the origin. Receivers use this for envelopes, gain, and amplitude modulation.
        - article [ref=e164]:
          - heading "Phase changes" [level=3] [ref=e165]
          - paragraph [ref=e166]: The point moves around the origin. PSK, carrier tracking, and coherent correlation depend on this angle.
        - article [ref=e167]:
          - heading "Frequency offset" [level=3] [ref=e168]
          - paragraph [ref=e169]: The point keeps rotating. Rotation speed and direction reveal Doppler and tuning error.
    - region "What engineers do with I/Q" [ref=e170]:
      - generic [ref=e171]:
        - generic [ref=e172]: Where the mental model pays rent
        - heading "What engineers do with I/Q" [level=2] [ref=e173]
      - generic [ref=e174]:
        - article [ref=e175]:
          - heading "GNSS acquisition and tracking" [level=3] [ref=e176]
          - paragraph [ref=e177]: Correlators compare complex samples against local PRN replicas. Carrier phase and Doppler become controlled rotations rather than billion-cycle-per-second waveforms.
        - article [ref=e178]:
          - heading "Digital communications" [level=3] [ref=e179]
          - paragraph [ref=e180]: QPSK and QAM intentionally place symbols at different I/Q coordinates. The constellation is a map of allowed amplitude-and-phase states.
        - article [ref=e181]:
          - heading "Spectrum and filtering" [level=3] [ref=e182]
          - paragraph [ref=e183]: Complex samples distinguish energy above and below the tuned center, enabling unambiguous shifts, channel selection, and analytic-signal processing.
        - article [ref=e184]:
          - heading "Debugging SDR recordings" [level=3] [ref=e185]
          - paragraph [ref=e186]: Wrong sample type, swapped I/Q, conjugation, DC offset, and I/Q imbalance create recognizable distortions. The “rotating arrow” model makes them easier to diagnose.
