    - region "Process bandwidth, not carrier frequency" [ref=e114]:
      - generic [ref=e115]:
        - generic [ref=e116]: The engineering payoff
        - heading "Process bandwidth, not carrier frequency" [level=2] [ref=e117]
        - paragraph [ref=e118]: Consider an illustrative 2 MHz-wide signal centered near GPS L1. Directly sampling the carrier and complex-sampling the downconverted band solve the same capture problem at very different rates.
      - generic [ref=e119]:
        - article [ref=e120]:
          - generic [ref=e121]: Direct RF
          - heading "Follow a 1.575 GHz carrier" [level=3] [ref=e122]
          - strong [ref=e125]: "> 3.15 billion real samples/s"
          - paragraph [ref=e126]: A simple Nyquist illustration for sampling from DC. Specialized bandpass-sampling designs can change the exact requirement.
        - article [ref=e127]:
          - generic [ref=e128]: Complex baseband
          - heading "Follow a roughly 2 MHz band" [level=3] [ref=e129]
          - strong [ref=e132]: about 2–4 million I/Q pairs/s
          - paragraph [ref=e133]: The exact rate includes filter transition room and application needs. The key scaling variable is occupied bandwidth.
      - paragraph [ref=e135]: Each I/Q sample has two numbers, so complex sampling is not free. But “two values at a few megasamples per second” is far cheaper than “one value at several gigasamples per second.”
    - region "Usually, alternating numbers" [ref=e136]:
      - generic [ref=e137]:
        - generic [ref=e138]: What is actually inside the file?
        - heading "Usually, alternating numbers" [level=2] [ref=e139]
        - paragraph [ref=e140]: An I/Q file often stores interleaved signed integers or floating-point values. The metadata—sample rate, center frequency, numeric type, scale, and I/Q ordering—is essential because raw bytes do not describe themselves.
