- generic [active] [ref=e1]:
  - banner [ref=e2]:
    - generic [ref=e3]: A signal-processing field guide
    - heading "Why store a signal as I/Q?" [level=1] [ref=e4]
    - paragraph [ref=e5]: Because “amplitude at each time” is enough only when you keep the fast RF waveform. I/Q lets us move that waveform down to a manageable speed without losing the phase and direction information that carries data.
    - paragraph [ref=e6]:
      - strong [ref=e7]: "The short answer:"
      - text: I/Q is amplitude
      - emphasis [ref=e8]: and phase
      - text: ", written as two coordinates. It stores the slowly changing shape of a radio signal, not every wiggle of its high-frequency carrier."
  - main [ref=e9]:
    - region "The carrier is fast. The information is slow." [ref=e10]:
      - generic [ref=e11]: Why this matters
      - heading "The carrier is fast. The information is slow." [level=2] [ref=e12]
      - paragraph [ref=e13]:
        - text: A GPS L1 signal rides on a carrier near
        - strong [ref=e14]: 1.575 GHz
        - text: . If you tried to store that raw voltage waveform directly, your converter and disk would need to deal with billions of samples each second. Yet the useful signal occupies only a small band around that carrier.
      - paragraph [ref=e15]:
        - text: A radio front end therefore removes the carrier before storage. But removing it carelessly would also erase whether the signal was ahead or behind in phase—and whether a component sat above or below the tuned frequency.
        - strong [ref=e16]: I/Q downconversion keeps those distinctions.
      - paragraph [ref=e17]: You meet this in SDR recordings, GPS simulators, Wi-Fi and cellular receivers, radar, digital modulation, spectrum analyzers, and almost any code that performs filtering, synchronization, demodulation, or correlation on radio samples.
      - text: I + jQ
    - region "“Amplitude + time” is not wrong" [ref=e18]:
      - generic [ref=e19]:
        - generic [ref=e20]: First, fix the premise
        - heading "“Amplitude + time” is not wrong" [level=2] [ref=e21]
        - paragraph [ref=e22]: A real ADC measures a signed voltage at each instant. If it samples fast enough, that one stream contains amplitude, frequency, and phase implicitly. The problem is not correctness; it is cost and convenience.
      - generic [ref=e23]:
        - article [ref=e24]:
          - generic [ref=e25]: "True"
          - heading "Raw real samples can store everything" [level=3] [ref=e26]
          - paragraph [ref=e27]:
            - text: Record
            - code [ref=e28]: +0.2, +0.9, +0.3, −0.7…
            - text: quickly enough and the shape of the waveform reveals its phase. No separate “phase column” is required.
        - article [ref=e29]:
          - generic [ref=e30]: The catch
          - heading "You must follow every carrier wiggle" [level=3] [ref=e31]
          - paragraph [ref=e32]: A gigahertz carrier changes sign billions of times per second. Most of those stored wiggles say “the carrier is still here,” not “here is new information.”
    - region "I/Q is a clock hand, not two mysterious signals" [ref=e33]:
      - generic [ref=e34]:
