    - region "The whole lesson in one thought" [ref=e225]:
      - generic [ref=e226]: Keep this sentence
      - heading "The whole lesson in one thought" [level=2] [ref=e227]
      - blockquote [ref=e228]: Real samples draw every fast wiggle. I/Q stores the slow motion of the arrow that creates those wiggles.
      - paragraph [ref=e229]: Both can represent the signal. I/Q is the representation that makes radio bandwidth, phase, frequency direction, modulation, and receiver algorithms manageable.
