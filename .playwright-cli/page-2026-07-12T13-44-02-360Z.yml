        - heading "I/Q is a clock hand, not two mysterious signals" [level=2] [ref=e36]
        - paragraph [ref=e37]:
          - text: Imagine freezing a sinusoid and describing its state with a rotating arrow. The horizontal coordinate is
          - strong [ref=e38]: I
          - text: (in-phase). The vertical coordinate is
          - strong [ref=e39]: Q
          - text: (quadrature, 90° away). Together they describe both length and angle.
